const ESTILOS_CITA = ["APA","ACS","Vancouver"];

function normalizeDoi(doi){
  return doi ? String(doi).replace(/^https?:\/\/(dx\.)?doi\.org\//i,"") : "";
}

// Formatea una referencia real según el estilo elegido. Es formateo puro de los
// metadatos que ya trae la fuente (autores, año, título, revista, DOI): no se
// inventa nada. El número n al inicio es el mismo que usan los marcadores [n] de
// los borradores y de la síntesis/MDE, para que el lector pueda mapearlos.
function formatCitation(r, i, estilo){
  const n = i + 1;
  const autores = r.autores || "Autor no disponible";
  const anio = r.anio || "s.f.";
  const titulo = r.titulo || "";
  const revista = r.revista || "";
  const doi = normalizeDoi(r.doi);
  const doiTxt = doi ? ` https://doi.org/${doi}` : "";
  if(estilo === "ACS"){
    return `(${n}) ${autores}. ${titulo}.${revista?` ${revista}`:""} ${anio}.${doiTxt}`;
  }
  if(estilo === "Vancouver"){
    return `${n}. ${autores}. ${titulo}.${revista?` ${revista}.`:""} ${anio}.${doiTxt}`;
  }
  // APA por defecto (autor-fecha). El [n] va como localizador para conectar con los borradores.
  return `[${n}] ${autores} (${anio}). ${titulo}.${revista?` ${revista}.`:""}${doiTxt}`;
}

/* ============ INTEROPERABILIDAD: SACAR EL CORPUS DE LA APP ============ */
// Un corpus curado que no se puede llevar a un gestor de referencias obliga a volver a
// teclearlo todo. Estos exportadores son formateo puro de los metadatos reales que ya
// estan en el estado: no llaman a la IA y no pueden inventar nada.

function descargarArchivo(nombre, contenido, mime){
  const blob = new Blob([contenido], {type: (mime||"text/plain") + ";charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = nombre;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}

// Nombre de archivo seguro a partir del tema del proyecto.
function slugProyecto(){
  const base = (state.idea.tema || "proyecto").toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 40);
  return base || "proyecto";
}

// Autores de una referencia como lista de personas. Prefiere SIEMPRE la lista estructurada
// que entrego la base de datos; solo cae al heuristico de partir la cadena cuando la
// referencia se escribio a mano y no hay lista.
function autoresDeRef(r){
  if(r && Array.isArray(r.autores_lista) && r.autores_lista.length) return r.autores_lista.slice();
  return partirAutores(r && r.autores);
}

// Heuristico de ultimo recurso para referencias escritas a mano. Partir por comas es
// ambiguo: "Silva, João" puede ser un autor en formato "Apellido, Nombre" o dos autores.
// Se resuelve a favor de un solo autor cuando hay una sola coma y ambos lados son cortos,
// que es el caso abrumadoramente mas comun al teclear una cita.
function partirAutores(autores){
  const txt = String(autores || "").trim();
  if(!txt) return [];
  if(txt.includes(";")){
    return txt.split(";").map(a=>a.trim()).filter(a=>a && !/^et\.?\s*al\.?$/i.test(a));
  }
  const comas = (txt.match(/,/g) || []).length;
  if(comas === 1){
    const [a, b] = txt.split(",").map(x=>x.trim());
    const corto = (s)=>s && s.split(/\s+/).length <= 3;
    if(corto(a) && corto(b) && !/^et\.?\s*al\.?$/i.test(b)) return [txt];
  }
  return txt.split(/,(?![^(]*\))/).map(a=>a.trim()).filter(a=>a && !/^et\.?\s*al\.?$/i.test(a));
}

function escaparBibtex(v){
  return String(v || "").replace(/[{}\\]/g, "").replace(/\s+/g, " ").trim();
}

// Clave de cita estable y legible: primerapellido + anio + primera palabra del titulo.
function claveBibtex(r, i){
  const autores = autoresDeRef(r);
  const apellido = autores.length
    ? autores[0].split(",")[0].split(/\s+/).pop()
    : "anon";
  const palabra = String(r.titulo || "").split(/\s+/).find(w=>w.length > 3) || "ref";
  const limpia = (s)=>String(s).toLowerCase().normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]/g, "");
  return (limpia(apellido) || "anon") + (r.anio || "sf") + (limpia(palabra) || String(i+1));
}

function toBibTeX(refs){
  return refs.map((r,i)=>{
    const campos = [];
    campos.push(["title", escaparBibtex(r.titulo)]);
    const autores = autoresDeRef(r);
    if(autores.length) campos.push(["author", autores.map(escaparBibtex).join(" and ")]);
    if(r.anio) campos.push(["year", escaparBibtex(r.anio)]);
    if(r.revista) campos.push(["journal", escaparBibtex(r.revista)]);
    const doi = normalizeDoi(r.doi);
    if(doi) campos.push(["doi", doi]);
    const u = refUrl(r);
    if(u && !doi) campos.push(["url", u]);
    if(r.resumen) campos.push(["abstract", escaparBibtex(r.resumen)]);
    // Nota interna: de donde salio y como se clasifico, para no perder la curaduria.
    if(r.fuente) campos.push(["note", escaparBibtex("Encontrado via " + r.fuente + (r.perspectiva ? "; componente: " + r.perspectiva : ""))]);
    const cuerpo = campos.map(([k,v])=>`  ${k} = {${v}}`).join(",\n");
    return `@article{${claveBibtex(r,i)},\n${cuerpo}\n}`;
  }).join("\n\n") + "\n";
}

function toRIS(refs){
  return refs.map(r=>{
    const l = [];
    l.push("TY  - JOUR");
    autoresDeRef(r).forEach(a=>l.push("AU  - " + a));
    if(r.titulo) l.push("TI  - " + r.titulo);
    if(r.anio) l.push("PY  - " + r.anio);
    if(r.revista) l.push("JO  - " + r.revista);
    if(r.resumen) l.push("AB  - " + String(r.resumen).replace(/\r?\n/g, " "));
    const doi = normalizeDoi(r.doi);
    if(doi) l.push("DO  - " + doi);
    const u = refUrl(r);
    if(u) l.push("UR  - " + u);
    if(r.fuente) l.push("DB  - " + r.fuente);
    l.push("ER  - ");
    return l.join("\r\n");
  }).join("\r\n\r\n") + "\r\n";
}

function celdaCsv(v){
  const t = String(v == null ? "" : v).replace(/\r?\n/g, " ");
  return /[",;]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t;
}

function toCSV(refs){
  const cabeceras = ["n","titulo","autores","anio","revista","doi","url","tipo_doc","acceso_abierto","citas","fuente_base","componente","ajuste","estado","aporte_a_mi_investigacion","resumen"];
  const filas = refs.map((r,i)=>[
    i+1, r.titulo, r.autores, r.anio, r.revista, normalizeDoi(r.doi), refUrl(r), r.tipo_doc,
    // "no se sabe" cuando la base no informa acceso abierto, en vez de un falso "no".
    (r.oa === true ? "si" : r.oa === false ? "no" : "no se sabe"),
    (typeof r.citas === "number" ? r.citas : ""),
    r.fuente, r.perspectiva, r.fuerza, r.estado, r.justificacion, r.resumen
  ].map(celdaCsv).join(","));
  // BOM para que Excel abra los acentos bien sin pedir nada al usuario.
  return "\uFEFF" + [cabeceras.join(","), ...filas].join("\r\n") + "\r\n";
}

// Exporta las referencias aceptadas, o todas si aun no se acepto ninguna, para que el
// boton nunca entregue un archivo vacio sin explicar por que.
function refsParaExportar(){
  const aceptadas = state.bibliografia.filter(r=>r.estado==="aceptada");
  return aceptadas.length ? aceptadas : state.bibliografia.slice();
}

function exportarCorpus(formato){
  const refs = refsParaExportar();
  if(refs.length === 0){ alert("Todavía no tienes referencias en tu bibliografía."); return; }
  const base = "biblioteca-viva-" + slugProyecto();
  if(formato === "bibtex") descargarArchivo(base + ".bib", toBibTeX(refs), "application/x-bibtex");
  else if(formato === "ris") descargarArchivo(base + ".ris", toRIS(refs), "application/x-research-info-systems");
  else if(formato === "csv") descargarArchivo(base + ".csv", toCSV(refs), "text/csv");
}

/* ============ LLEVARSE EL PROYECTO COMPLETO ============ */
// El progreso vive en localStorage, que es del navegador y del dispositivo: quien usa la
// app por QR en el telefono y luego abre su laptop no encuentra nada. Esto lo hace
// portable y respaldable, sin necesidad de cuentas ni de servidor.
function exportarProyecto(){
  const payload = {
    _formato: "biblioteca-viva-proyecto",
    _version: 1,
    _exportado: new Date().toISOString(),
    proyecto: state
  };
  descargarArchivo("biblioteca-viva-" + slugProyecto() + ".json", JSON.stringify(payload, null, 2), "application/json");
}

function importarProyecto(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    let datos;
    try{
      datos = JSON.parse(String(reader.result));
    }catch(e){
      alert("Ese archivo no es un proyecto de Biblioteca Viva válido (no se pudo leer como JSON).");
      return;
    }
    const p = datos && datos._formato === "biblioteca-viva-proyecto" ? datos.proyecto : datos;
    // Validacion minima: tiene que parecerse a un proyecto, no a cualquier JSON.
    if(!p || typeof p !== "object" || typeof p.idea !== "object" || !Array.isArray(p.bibliografia)){
      alert("Ese archivo no parece un proyecto de Biblioteca Viva.");
      return;
    }
    if(!confirm("Esto reemplazará el proyecto que tienes abierto ahora. ¿Continuar?")) return;
    state = p;
    migrateState();
    saveState();
    // Los resultados de busqueda son transitorios y pertenecen a la sesion anterior.
    searchState = { activo: null, resultados: {}, error: {}, meta: {} };
    searchControls = {};
    render();
  };
  reader.onerror = () => alert("No se pudo leer el archivo.");
  reader.readAsText(file);
}

/* ============ REGISTRO DE BUSQUEDA: PARRAFO DE METODOS ============ */
// Convierte state.busquedas en un parrafo que se puede pegar en la seccion de metodos.
// Es formateo de datos reales registrados, no una redaccion del modelo.
function buildMetodosBusqueda(){
  const bs = state.busquedas || [];
  if(bs.length === 0) return "";
  const fechas = bs.map(b=>String(b.fecha||"").slice(0,10)).filter(Boolean).sort();
  const basesUsadas = new Set();
  bs.forEach(b=>Object.entries(b.por_base||{}).forEach(([n,v])=>{ if(v !== null) basesUsadas.add(n); }));
  const aceptadas = state.bibliografia.filter(r=>r.estado==="aceptada").length;
  const rango = fechas.length && fechas[0] !== fechas[fechas.length-1]
    ? `entre el ${fechas[0]} y el ${fechas[fechas.length-1]}`
    : `el ${fechas[0] || "s.f."}`;
  const conFiltroAnio = bs.filter(b=>b.filtros && b.filtros.desde_anio);
  const anioMin = conFiltroAnio.length ? Math.min(...conFiltroAnio.map(b=>b.filtros.desde_anio)) : null;
  const manuales = bs.filter(b=>b.query_origen === "manual").length;
  return `La búsqueda bibliográfica se ejecutó ${rango} sobre ${[...basesUsadas].join(", ")}, ` +
    `mediante ${bs.length} ${bs.length===1?"consulta":"consultas"} distribuidas en ${new Set(bs.map(b=>b.componente)).size} ` +
    `${new Set(bs.map(b=>b.componente)).size===1?"componente":"componentes"} del trabajo` +
    (manuales ? `, de las cuales ${manuales} ${manuales===1?"fue formulada":"fueron formuladas"} manualmente por el investigador` : "") +
    (anioMin ? `, con un límite inferior de año de publicación de ${anioMin}` : "") +
    `. Los resultados se deduplicaron por DOI y por título normalizado. ` +
    `De los registros recuperados, ${state.bibliografia.length} se incorporaron a la bibliografía para cribado y ${aceptadas} se aceptaron como evidencia. ` +
    `El detalle por consulta se conserva en el registro de búsqueda.`;
}

/* ============ FASE C: BORRADORES PARA PUBLICAR ============ */
// Genera los borradores citados por sección + tabla comparativa. Hace su propio
// fetch (no callAgent) porque el informe se dibuja fuera del render() principal;
// gestiona su propio estado de carga (borradoresState) y vuelve a dibujar el
// informe al terminar, igual patrón que la extracción de PDF.
async function generarBorradores(){
  const refs = state.bibliografia.filter(r=>r.estado==="aceptada");
  if(refs.length < 1){ alert("Acepta al menos una referencia para generar borradores."); return; }
  borradoresState = { activo: true, error: "" };
  showEvidenceReport();
  const referencias = refs.map(r=>({
    titulo:r.titulo, autores:r.autores, anio:r.anio,
    resumen:r.resumen||"", justificacion:r.justificacion||""
  }));
  try{
    const resp = await fetch("/api/generate", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({task:"borradores", payload:{
        idea: state.idea,
        pregunta: state.pregunta,
        referencias,
        sintesis: state.sintesis || [],
        mde: state.mde || []
      }})
    });
    if(!resp.ok){
      let msg = "No se pudieron generar los borradores.";
      try{ const e = await resp.json(); if(e && e.error) msg = e.error; }catch(_){}
      throw new Error(msg);
    }
    const data = await resp.json();
    state.borradores = data.result || null;
    saveState();
    borradoresState = { activo: false, error: "" };
  }catch(e){
    console.error("Error generando borradores:", e);
    borradoresState = { activo: false, error: e.message || "No se pudieron generar los borradores. Inténtalo de nuevo." };
  }
  showEvidenceReport();
}

// Bloque de "Borradores para publicar" dentro del informe de evidencia.
function renderBorradoresReport(){
  if(borradoresState.activo){
    return reportSection("Borradores para publicar",
      `<div class="loading"><div class="spinner"></div> EugenIA está redactando los borradores citados…</div>`);
  }
  const b = state.borradores;
  if(!b){
    const errHtml = borradoresState.error ? `<p class="hint" style="color:var(--danger);">${escapeHtml(borradoresState.error)}</p>` : "";
    return reportSection("Borradores para publicar",
      `<p>Convierte tu evidencia curada en borradores de párrafo citados por sección (justificación, métodos, comparación y discusión) y una tabla comparativa de tus fuentes. Cada afirmación cita las referencias reales por su número. Son un punto de partida para editar, no un texto final.</p>
       ${errHtml}
       <button class="btn btn-accent" id="btnGenBorradores" style="width:100%;">Generar borradores para publicar</button>`);
  }
  const secciones = [
    ["Justificación y brecha", b.justificacion],
    ["Métodos", b.metodos],
    ["Comparación de resultados", b.comparacion],
    ["Discusión y contraste", b.discusion]
  ].map(([t,body])=> body ? `<h3 style="font-size:15px;margin-top:14px;">${t}</h3><p>${escapeHtml(body)}</p>` : "").join("");
  const filas = (Array.isArray(b.tabla_comparativa)?b.tabla_comparativa:[]).map(row=>
    `<tr><td>[${escapeHtml(String(row.fuente))}]</td><td>${escapeHtml(row.enfoque||"")}</td><td>${escapeHtml(row.hallazgo_principal||"")}</td><td>${escapeHtml(row.limitacion||"")}</td></tr>`
  ).join("");
  const tabla = filas
    ? `<h3 style="font-size:15px;margin-top:16px;">Tabla comparativa de fuentes</h3><div style="overflow-x:auto;"><table style="width:100%;border-collapse:collapse;font-size:13px;"><thead><tr><th>Fuente</th><th>Enfoque</th><th>Hallazgo principal</th><th>Limitación</th></tr></thead><tbody>${filas}</tbody></table></div>`
    : "";
  return reportSection("Borradores para publicar",
    `<p class="hint">Los marcadores [n] remiten al número n de la referencia en la lista de abajo. Revisa y edita cada borrador; verifícalo contra los textos completos antes de publicar.</p>
     ${secciones}${tabla}
     <button class="btn btn-ghost" id="btnGenBorradores" style="width:100%;margin-top:12px;">Regenerar borradores</button>`);
}

function reportSection(title, body){
  return `<section class="card"><h2 style="font-size:20px;">${title}</h2>${body}</section>`;
}

// Bloques de "Tus resultados" y "Auditoría de defendibilidad" dentro del informe.
// A diferencia de los borradores, la auditoría ya se genera y persiste en su propio
// paso (patrón sintesis/mde), así que aquí solo se lee state.auditoria de forma
// síncrona, sin estado de carga propio.
function renderResultadosReport(){
  const items = state.resultadosPropios || [];
  if(!items.length) return `<p>No se han declarado resultados propios.</p>`;
  return `<ul style="padding-left:22px;">${items.map(r=>
    `<li style="margin-bottom:10px;"><b>${escapeHtml(r.titulo)}</b>${r.hallazgo ? `: ${escapeHtml(r.hallazgo)}` : ""}${r.limitaciones ? ` <span class="hint">(Limitaciones: ${escapeHtml(r.limitaciones)})</span>` : ""}</li>`
  ).join("")}</ul>`;
}

function renderAuditoriaReport(){
  const aud = state.auditoria;
  if(!aud) return `<p>No se ha generado una auditoría de defendibilidad.</p>`;
  const refs = state.bibliografia.filter(r=>r.estado==="aceptada");
  const cobertura = Array.isArray(aud.cobertura) ? aud.cobertura : [];
  const chips = cobertura.map(c=>{
    const nombre = DIMENSIONES_AUDITORIA[c.dimension] || c.dimension;
    const cls = c.estado === "senales_encontradas" ? "chip" : "chip pending";
    return `<span class="${cls}" title="${escapeAttr(c.nota||"")}">${escapeHtml(nombre)}</span>`;
  }).join("");
  const senales = Array.isArray(aud.senales) ? aud.senales : [];
  const filas = senales.map(sn=>{
    const prefijo = sn.dimension === "etica" ? "Pregunta a considerar: " : "";
    return `<div class="finding ${sn.severidad==='alta'?'contradiccion':(sn.severidad==='baja'?'brecha':'')}" style="padding:12px 14px;margin:10px 0;">
      <div class="finding-label">${escapeHtml(DIMENSIONES_AUDITORIA[sn.dimension]||sn.dimension)} · severidad ${escapeHtml(sn.severidad)}</div>
      <p><b>${prefijo}${escapeHtml(sn.senal)}</b></p>
      <p>${escapeHtml(sn.por_que_importa)}</p>
      <p class="hint">${escapeHtml(sn.ancla_detalle)}${(sn.fuentes&&sn.fuentes.length)?` · Fuentes: ${sn.fuentes.map(n=>`[${n}]`).join(", ")}`:""}</p>
    </div>`;
  }).join("") || `<p>No se encontraron señales con base suficiente en la evidencia provista.</p>`;
  return `<div style="margin-bottom:10px;">${chips}</div>${filas}`;
}

// Registro de busqueda dentro del informe: la tabla de lo que realmente se busco, mas el
// parrafo de metodos listo para pegar. Es lo que permite que otra persona (o el propio
// investigador meses despues) reconstruya como se armo el corpus.
function renderRegistroBusquedaReport(){
  const bs = state.busquedas || [];
  if(!bs.length) return `<p>No hay búsquedas registradas todavía.</p>`;
  const filas = bs.map(b=>{
    const bases = Object.entries(b.por_base||{})
      .map(([n,v])=>`${n}: ${v===null?"no respondió":v}`).join("; ");
    const f = b.filtros || {};
    const filtros = [
      f.desde_anio ? "desde " + f.desde_anio : "",
      f.tipo === "revision" ? "solo revisiones" : (f.tipo === "primario" ? "sin revisiones" : "")
    ].filter(Boolean).join(", ") || "ninguno";
    return `<tr>
      <td>${escapeHtml(String(b.fecha||"").slice(0,10))}</td>
      <td>${escapeHtml(b.componente||"")}</td>
      <td style="font-family:ui-monospace,Consolas,monospace;font-size:12px;">${escapeHtml(b.query||"")}${b.query_ampliada?`<br><span class="hint">ampliada: ${escapeHtml(b.query_ampliada)}</span>`:""}</td>
      <td>${b.query_origen === "manual" ? "investigador" : "EugenIA"}</td>
      <td>${escapeHtml(filtros)}</td>
      <td>${escapeHtml(bases)}</td>
      <td>${b.mostrados}</td>
    </tr>`;
  }).join("");
  const metodos = buildMetodosBusqueda();
  return `
    <div style="overflow-x:auto;"><table style="width:100%;border-collapse:collapse;font-size:12.5px;">
      <thead><tr><th>Fecha</th><th>Componente</th><th>Consulta</th><th>Origen</th><th>Filtros</th><th>Resultados por base</th><th>Mostrados</th></tr></thead>
      <tbody>${filas}</tbody>
    </table></div>
    ${metodos ? `<div style="margin-top:14px;"><p><b>Párrafo de métodos, listo para adaptar:</b></p><p style="background:var(--soft);border-radius:10px;padding:12px 14px;">${escapeHtml(metodos)}</p></div>` : ""}`;
}

function showEvidenceReport(){
  const refs = state.bibliografia.filter(r=>r.estado==="aceptada");
  const synthesis = (state.sintesis||[]).map(h=>`
    <div class="finding ${escapeAttr(h.tipo)}" style="padding:12px 14px;margin:10px 0;">
      <div class="finding-label">${escapeHtml(h.tipo)} · confianza ${escapeHtml(h.confianza)}</div>
      <p><b>${escapeHtml(h.hallazgo)}</b></p>
      <p>${escapeHtml(h.implicacion)}</p>
      <p class="hint">Fuentes: ${(h.fuentes||[]).map(n=>`[${n}]`).join(", ")||"No asignadas"}</p>
    </div>`).join("") || `<p>No se ha generado una síntesis.</p>`;
  const matrix = (state.mde||[]).map(d=>`
    <tr><td>${escapeHtml(d.dimension)}</td><td>${escapeHtml(d.hallazgo_evidencia)}</td><td>${escapeHtml(d.criterio_adoptado)}</td><td>${(d.fuentes||[]).map(n=>`[${n}]`).join(", ")}</td></tr>`).join("");
  const matrixHtml = matrix ? `<div style="overflow-x:auto;"><table style="width:100%;border-collapse:collapse;font-size:13px;"><thead><tr><th>Dimensión</th><th>Evidencia</th><th>Criterio</th><th>Fuentes</th></tr></thead><tbody>${matrix}</tbody></table></div>` : `<p>No se ha generado una Matriz de Decisión.</p>`;
  const estilo = ESTILOS_CITA.includes(state.citaEstilo) ? state.citaEstilo : "APA";
  const bibliography = refs.map((r,i)=>`<li style="margin-bottom:10px;">${escapeHtml(formatCitation(r,i,estilo))}</li>`).join("") || `<li>No hay referencias aceptadas.</li>`;
  const estiloSelector = refs.length ? `
    <label style="margin-top:0;">Estilo de cita</label>
    <select id="citaEstilo" style="max-width:220px;">${ESTILOS_CITA.map(e=>`<option value="${e}" ${estilo===e?'selected':''}>${e}</option>`).join("")}</select>` : "";
  const app = document.getElementById("app");
  app.innerHTML = `<main style="padding-bottom:40px;">
    <div class="final-card"><h1 style="color:#fff;font-size:25px;">Informe de evidencia</h1><p>Biblioteca Viva · EugenIA Lab</p></div>
    <div class="report-actions">
      <button class="btn btn-ghost" id="btnBackReport">Volver</button>
      <button class="btn btn-ghost" id="btnTextReport">Descargar texto</button>
      <button class="btn btn-primary" id="btnPrintReport">Imprimir / PDF</button>
    </div>
    <div class="card" style="margin-bottom:14px;">
      <h3 style="font-size:15px;margin:0 0 4px 0;">Llévate tu bibliografía</h3>
      <p class="hint" style="margin:0 0 10px 0;">Exporta las ${refs.length ? refs.length + " referencias aceptadas" : "referencias"} a tu gestor de referencias o a una hoja de cálculo. Son tus metadatos reales, sin pasar por la IA.</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="small-btn export-corpus" data-formato="bibtex" type="button" style="flex:1;min-width:110px;">BibTeX (.bib)</button>
        <button class="small-btn export-corpus" data-formato="ris" type="button" style="flex:1;min-width:110px;">RIS (.ris)</button>
        <button class="small-btn export-corpus" data-formato="csv" type="button" style="flex:1;min-width:110px;">Tabla (.csv)</button>
      </div>
      <p class="hint" style="margin:8px 0 0 0;">BibTeX y RIS los importan Zotero, Mendeley y EndNote. El CSV incluye el ajuste evaluado, el componente y tu justificación de cada fuente.</p>
    </div>
    ${reportSection("Foco de investigación", `<p><b>Tema:</b> ${escapeHtml(state.idea.tema)}</p><p><b>Pregunta:</b> ${escapeHtml(state.pregunta.pregunta_principal)}</p><p><b>Objetivo:</b> ${escapeHtml(state.pregunta.objetivo_general)||"No definido"}</p>`)}
    ${reportSection("Síntesis de evidencia", synthesis)}
    ${reportSection("Matriz de Decisión", matrixHtml)}
    ${renderBorradoresReport()}
    ${reportSection("Tus resultados", renderResultadosReport())}
    ${reportSection("Auditoría de defendibilidad", renderAuditoriaReport())}
    ${reportSection("Referencias aceptadas", `${estiloSelector}<ul style="list-style:none;padding-left:0;margin-top:12px;">${bibliography}</ul>`)}
    ${reportSection("Registro de búsqueda", renderRegistroBusquedaReport())}
    <p class="hint">Análisis generado a partir de títulos y resúmenes disponibles. Debe verificarse contra los textos completos antes de publicación o toma de decisiones definitiva.</p>
  </main>`;
  document.querySelectorAll("th,td").forEach(el=>{el.style.border="1px solid #DCE5D5";el.style.padding="8px";el.style.textAlign="left";el.style.verticalAlign="top";});
  document.getElementById("btnBackReport").onclick = showSummary;
  document.getElementById("btnPrintReport").onclick = () => window.print();
  document.getElementById("btnTextReport").onclick = downloadEvidenceReport;
  document.querySelectorAll(".export-corpus").forEach(b=>{
    b.onclick = () => exportarCorpus(b.dataset.formato);
  });
  const btnGenBorr = document.getElementById("btnGenBorradores");
  if(btnGenBorr) btnGenBorr.onclick = generarBorradores;
  const selEstilo = document.getElementById("citaEstilo");
  if(selEstilo) selEstilo.onchange = () => { state.citaEstilo = selEstilo.value; saveState(); showEvidenceReport(); };
  window.scrollTo(0,0);
}

function downloadEvidenceReport(){
  const refs = state.bibliografia.filter(r=>r.estado==="aceptada");
  const lines = [
    "INFORME DE EVIDENCIA | BIBLIOTECA VIVA",
    "", `Tema: ${state.idea.tema}`, `Pregunta: ${state.pregunta.pregunta_principal}`,
    `Objetivo: ${state.pregunta.objetivo_general||"No definido"}`, "", "SÍNTESIS DE EVIDENCIA"
  ];
  (state.sintesis||[]).forEach(h=>lines.push(`\n${h.tipo.toUpperCase()} | Confianza ${h.confianza}\n${h.hallazgo}\nImplicación: ${h.implicacion}\nFuentes: ${(h.fuentes||[]).map(n=>`[${n}]`).join(", ")}`));
  lines.push("", "MATRIZ DE DECISIÓN");
  (state.mde||[]).forEach(d=>lines.push(`\n${d.dimension}\nEvidencia: ${d.hallazgo_evidencia}\nCriterio: ${d.criterio_adoptado}\nFuentes: ${(d.fuentes||[]).map(n=>`[${n}]`).join(", ")}`));
  const b = state.borradores;
  if(b){
    lines.push("", "BORRADORES PARA PUBLICAR");
    if(b.justificacion) lines.push(`\nJustificación y brecha:\n${b.justificacion}`);
    if(b.metodos) lines.push(`\nMétodos:\n${b.metodos}`);
    if(b.comparacion) lines.push(`\nComparación de resultados:\n${b.comparacion}`);
    if(b.discusion) lines.push(`\nDiscusión y contraste:\n${b.discusion}`);
    if(Array.isArray(b.tabla_comparativa) && b.tabla_comparativa.length){
      lines.push("", "Tabla comparativa de fuentes");
      b.tabla_comparativa.forEach(row=>lines.push(`[${row.fuente}] Enfoque: ${row.enfoque||"-"} | Hallazgo: ${row.hallazgo_principal||"-"} | Limitación: ${row.limitacion||"-"}`));
    }
  }
  const propios = state.resultadosPropios || [];
  lines.push("", "TUS RESULTADOS");
  if(propios.length){
    propios.forEach(r=>lines.push(`\n${r.titulo}${r.hallazgo?`\nHallazgo: ${r.hallazgo}`:""}${r.limitaciones?`\nLimitaciones: ${r.limitaciones}`:""}`));
  } else {
    lines.push("No se han declarado resultados propios.");
  }
  const aud = state.auditoria;
  lines.push("", "AUDITORÍA DE DEFENDIBILIDAD");
  if(aud){
    (aud.cobertura||[]).forEach(c=>lines.push(`${DIMENSIONES_AUDITORIA[c.dimension]||c.dimension}: ${c.estado} (${c.nota})`));
    (aud.senales||[]).forEach(sn=>lines.push(`\n[${DIMENSIONES_AUDITORIA[sn.dimension]||sn.dimension} | severidad ${sn.severidad}] ${sn.dimension==='etica'?'Pregunta a considerar: ':''}${sn.senal}\nPor qué importa: ${sn.por_que_importa}\nAncla: ${sn.ancla_detalle}${(sn.fuentes&&sn.fuentes.length)?` | Fuentes: ${sn.fuentes.map(n=>`[${n}]`).join(", ")}`:""}`));
  } else {
    lines.push("No se ha generado una auditoría de defendibilidad.");
  }
  const estilo = ESTILOS_CITA.includes(state.citaEstilo) ? state.citaEstilo : "APA";
  lines.push("", `REFERENCIAS (${estilo})`);
  refs.forEach((r,i)=>lines.push(formatCitation(r,i,estilo)));
  const bs = state.busquedas || [];
  lines.push("", "REGISTRO DE BÚSQUEDA");
  if(bs.length){
    bs.forEach(b=>{
      const bases = Object.entries(b.por_base||{})
        .map(([n,v])=>`${n}: ${v===null?"no respondió":v}`).join("; ");
      const f = b.filtros || {};
      const filtros = [
        f.desde_anio ? "desde " + f.desde_anio : "",
        f.tipo === "revision" ? "solo revisiones" : (f.tipo === "primario" ? "sin revisiones" : "")
      ].filter(Boolean).join(", ") || "ninguno";
      lines.push(`\n${String(b.fecha||"").slice(0,10)} | ${b.componente}`);
      lines.push(`Consulta (${b.query_origen === "manual" ? "investigador" : "EugenIA"}): ${b.query}`);
      if(b.query_ampliada) lines.push(`Consulta ampliada: ${b.query_ampliada}`);
      lines.push(`Filtros: ${filtros}`);
      lines.push(`Resultados por base: ${bases} | mostrados: ${b.mostrados}`);
    });
    const metodos = buildMetodosBusqueda();
    if(metodos) lines.push("", "Párrafo de métodos, listo para adaptar:", metodos);
  } else {
    lines.push("No hay búsquedas registradas.");
  }
  lines.push("", "Nota: análisis basado en títulos y resúmenes disponibles; verificar con los textos completos.");
  const blob = new Blob([lines.join("\n")], {type:"text/plain;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "informe-evidencia-biblioteca-viva.txt";
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

/* ============ UTILS ============ */
function escapeHtml(str){
  if(!str) return "";
  return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function escapeAttr(str){
  if(!str) return "";
  return String(str).replace(/&/g,"&amp;").replace(/"/g,"&quot;");
}

/* ============ INIT ============ */
loadState();
</script>
</body>
</html>
